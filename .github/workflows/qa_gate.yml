name: QA Verification & Architecture Gate

on:
  push:
    branches: ["main", "DEV-WSRV/*"]
  pull_request:
    branches: ["main"]

jobs:
  backend-qa:
    name: Backend QA Battery & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting & Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pylint pytest pytest-cov

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Pylint Check
        run: |
          pylint --rcfile=.pylintrc backend/app

      - name: Run Dockerized Sandbox Tests
        run: |
          chmod +x run_tests_docker.sh
          ./run_tests_docker.sh

  vscode-extension-qa:
    name: VS Code Extension Build & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Extension Dependencies
        run: |
          cd vscode-extension/extension
          npm ci || npm install

      - name: Compile Extension TypeScript
        run: |
          cd vscode-extension/extension
          npm run compile

      - name: Package VSIX Verification
        run: |
          cd vscode-extension/extension
          npx @vscode/vsce package --allow-missing-repository
