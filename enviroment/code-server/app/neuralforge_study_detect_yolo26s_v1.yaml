model: "yolo26s.pt"
type: "yolo"
task: "detect"

train:
  data: /datasets/examples/detection/eletronic_components/data.yaml
  epochs: 5
  imgsz: 640
  device: 0
  optimizer: AdamW

sweeper:
  debug: "192.168.1.68"
  version: 1
  algorithm: optuna
  direction: maximize
  fitness: "metrics/mAP50-95(B)"
  study_name: "study_detect_yolo26s_v1"
  sampler: "TPESampler"
  n_trials: 2
  priority: "low"

  search_space:
    model:
    - choice
    - yolo26n.pt
    - yolo26s.pt
    - yolo26m.pt
    train:
      imgsz:
      - choice
      - 640
      - 768
      - 1024
      lr0:
      - loguniform
      - 0.0001
      - 0.01

extras:
  gpu:
    id: 0
    limit: 0.60

metadata:
  author: "William Rodriguez"
  content: "Entrenamiento de modelo YOLO con NeuralForge"
  documentation: "Configuración generada desde NeuralForge Training Studio Hub"
